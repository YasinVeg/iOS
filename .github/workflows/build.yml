name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom build number (optional)'
        required: false
        type: string

jobs:
  build:
    name: Build iOS (release_arm64)
    runs-on: macos-26          # или xcode-27 (если доступен в твоём плане)

    timeout-minutes: 360       # Telegram-iOS собирается долго

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 27.1
        run: |
          set -e
          echo "Available Xcodes:"
          ls /Applications | grep -i xcode || true

          # Пытаемся найти Xcode 27.1
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_27.1_Release_Candidate.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer
          elif [ -d "/Applications/Xcode_27.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          else
            echo "Xcode 27.x not found, using default"
            xcode-select -p
          fi

          echo "Active Xcode:"
          xcodebuild -version
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          # Копируем в стабильный путь (нужно для воспроизводимых бинарников)
          sudo rm -rf /Users/Shared/telegram-ios
          sudo cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          sudo chown -R $(whoami) /Users/Shared/telegram-ios

      - name: Build the App
        working-directory: /Users/Shared/telegram-ios
        run: |
          set -euo pipefail
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          # Build number
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
            COMMIT_COUNT=$(git rev-list --count HEAD)
            BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          fi

          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          echo "Building Novagram / Telegram iOS $APP_VERSION ($BUILD_NUMBER)"

          # Импорт фейковых сертификатов (unsigned build)
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Основная сборка
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Собираем артефакты
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          # IPA
          find bazel-out -name "Telegram.ipa" -path "*/bin/Telegram/*" 2>/dev/null | head -1 | while read f; do
            echo "Found IPA: $f"
            cp "$f" "$OUTPUT_PATH/Telegram.ipa"
          done

          # dSYMs
          mkdir -p build/DSYMs
          find bazel-out -name "*.dSYM" -path "*/bin/Telegram/*" 2>/dev/null | while read f; do
            cp -R "$f" build/DSYMs/ || true
          done

          if [ -d "build/DSYMs" ] && [ "$(ls -A build/DSYMs)" ]; then
            zip -r "$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs
          fi

          echo "=== Artifacts ==="
          ls -lh "$OUTPUT_PATH" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release (only on tags or manual)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Novagram / Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned build of Novagram (Telegram-iOS fork)
            - Version: ${{ env.APP_VERSION }}
            - Build: ${{ env.BUILD_NUMBER }}
            - Configuration: release_arm64
            - Codesigning: fake (development/unsigned)
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
